name: PHP includes conversion builder

on:
  push:
    branches:
      - automation/php-includes-build

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: automation/php-includes-build
          fetch-depth: 0
      - name: Build and verify conservative PHP include architecture
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/php_includes_refactor.py
          python3 -m py_compile /tmp/php_includes_refactor.py
          python3 /tmp/php_includes_refactor.py
      - name: Remove temporary workflow and commit generated architecture
        shell: bash
        run: |
          rm -f .github/workflows/php-includes-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: introduce maintainable PHP includes"
          git push origin HEAD:automation/php-includes-build
