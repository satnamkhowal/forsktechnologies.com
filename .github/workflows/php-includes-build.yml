name: PHP includes conversion builder

on:
  push:
    branches:
      - automation/php-includes-build

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: automation/php-includes-build
          fetch-depth: 0
      - name: Build and verify conservative PHP include architecture
        shell: bash
        run: |
          python3 -m py_compile .github/refactor_php_includes.py
          python3 .github/refactor_php_includes.py
      - name: Remove temporary builder and commit generated architecture
        shell: bash
        run: |
          rm -f .github/workflows/php-includes-build.yml .github/refactor_php_includes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: introduce maintainable PHP includes"
          git push origin HEAD:automation/php-includes-build
