name: Diagnose PHP include render

on:
  push:
    branches:
      - automation/php-includes-build

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/php-includes-build
          fetch-depth: 0
      - name: Diagnose about page render mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          originals = {p.name: p.read_text(encoding='utf-8') for p in Path('.').glob('*.html')}
          about = originals['about.html']

          def render(path):
              result = subprocess.run(['php', str(path)], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              print('php returncode:', result.returncode)
              if result.stderr:
                  print('php stderr:', result.stderr.decode('utf-8', errors='replace')[:2000])
              return result.stdout.decode('utf-8', errors='replace')

          Path('/tmp/about-raw.php').write_text(about, encoding='utf-8')
          raw = render('/tmp/about-raw.php')
          print('raw php equals original:', raw == about)

          footer_re = re.compile(r'<footer class="xb-footer\b[\s\S]*?</footer>')
          scripts_re = re.compile(r'<script id="popper-js"[\s\S]*?<script src="assets/js/search-index\.js"></script><script src="assets/js/static\.js"></script>')

          def most_common_block(pattern):
              groups = collections.defaultdict(list)
              blocks = {}
              for name, text in originals.items():
                  m = pattern.search(text)
                  if not m:
                      continue
                  block = m.group(0)
                  digest = hashlib.sha256(block.encode()).hexdigest()
                  groups[digest].append(name)
                  blocks[digest] = block
              digest, pages = max(groups.items(), key=lambda item: len(item[1]))
              print('reuse count:', len(pages), 'sample pages:', pages[:10])
              return blocks[digest]

          footer = most_common_block(footer_re)
          scripts = most_common_block(scripts_re)
          Path('includes').mkdir(exist_ok=True)
          Path('includes/footer.php').write_text(footer, encoding='utf-8')
          Path('includes/scripts.php').write_text(scripts, encoding='utf-8')

          transformed = about
          fm = footer_re.search(transformed)
          if fm and fm.group(0) == footer:
              transformed = transformed[:fm.start()] + "<?php require __DIR__ . '/includes/footer.php'; ?>" + transformed[fm.end():]
          sm = scripts_re.search(transformed)
          if sm and sm.group(0) == scripts:
              transformed = transformed[:sm.start()] + "<?php require __DIR__ . '/includes/scripts.php'; ?>" + transformed[sm.end():]
          Path('about.php').write_text(transformed, encoding='utf-8')
          rendered = render('about.php')
          print('include render equals original:', rendered == about)
          print('original length:', len(about), 'rendered length:', len(rendered))

          if rendered != about:
              limit = min(len(about), len(rendered))
              idx = next((i for i in range(limit) if about[i] != rendered[i]), limit)
              print('first diff index:', idx)
              print('ORIGINAL CONTEXT:', repr(about[max(0, idx-160):idx+320]))
              print('RENDERED CONTEXT:', repr(rendered[max(0, idx-160):idx+320]))
              if len(about) != len(rendered) and idx == limit:
                  print('difference begins at EOF')
              raise SystemExit(1)
          PY
