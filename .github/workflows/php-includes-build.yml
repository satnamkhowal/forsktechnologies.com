name: PHP includes conversion builder

on:
  push:
    branches:
      - automation/php-includes-build
    paths:
      - .github/workflows/php-includes-build.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: automation/php-includes-build
          fetch-depth: 0

      - name: Build conservative PHP include architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import collections
          import hashlib
          import html
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path('.')
          html_files = sorted(ROOT.glob('*.html'))
          if not html_files:
              raise SystemExit('No root HTML pages found; refusing to refactor.')

          originals = {p.name: p.read_text(encoding='utf-8') for p in html_files}

          footer_re = re.compile(r'<footer class="xb-footer\b[\s\S]*?</footer>')
          scripts_re = re.compile(
              r'<script id="popper-js"[\s\S]*?'
              r'<script src="assets/js/search-index\.js"></script>'
              r'<script src="assets/js/static\.js"></script>'
          )

          footer_groups: dict[str, list[str]] = collections.defaultdict(list)
          footer_content: dict[str, str] = {}
          scripts_groups: dict[str, list[str]] = collections.defaultdict(list)
          scripts_content: dict[str, str] = {}

          for name, text in originals.items():
              fm = footer_re.search(text)
              if fm:
                  block = fm.group(0)
                  digest = hashlib.sha256(block.encode()).hexdigest()
                  footer_groups[digest].append(name)
                  footer_content[digest] = block
              sm = scripts_re.search(text)
              if sm:
                  block = sm.group(0)
                  digest = hashlib.sha256(block.encode()).hexdigest()
                  scripts_groups[digest].append(name)
                  scripts_content[digest] = block

          if not footer_groups:
              raise SystemExit('No reusable footer block detected.')
          if not scripts_groups:
              raise SystemExit('No reusable common script bundle detected.')

          footer_hash, footer_pages = max(footer_groups.items(), key=lambda item: len(item[1]))
          scripts_hash, scripts_pages = max(scripts_groups.items(), key=lambda item: len(item[1]))
          canonical_footer = footer_content[footer_hash]
          canonical_scripts = scripts_content[scripts_hash]

          # A shared include is only justified when it is genuinely reused.
          if len(footer_pages) < 2:
              raise SystemExit('Footer reuse count is below 2; refusing to create a fake shared include.')
          if len(scripts_pages) < 2:
              raise SystemExit('Script-bundle reuse count is below 2; refusing to create a fake shared include.')

          includes = ROOT / 'includes'
          includes.mkdir(exist_ok=True)
          (includes / 'footer.php').write_text(canonical_footer, encoding='utf-8')
          (includes / 'scripts.php').write_text(canonical_scripts, encoding='utf-8')

          footer_marker = "<?php require __DIR__ . '/includes/footer.php'; ?>"
          scripts_marker = "<?php require __DIR__ . '/includes/scripts.php'; ?>"

          converted: list[str] = []
          footer_converted: list[str] = []
          scripts_converted: list[str] = []

          for source in html_files:
              text = originals[source.name]
              changed = False

              fm = footer_re.search(text)
              if fm and fm.group(0) == canonical_footer:
                  text = text[:fm.start()] + footer_marker + text[fm.end():]
                  changed = True
                  footer_converted.append(source.name)

              sm = scripts_re.search(text)
              if sm and sm.group(0) == canonical_scripts:
                  text = text[:sm.start()] + scripts_marker + text[sm.end():]
                  changed = True
                  scripts_converted.append(source.name)

              if not changed:
                  continue

              target = source.with_suffix('.php')
              if target.exists():
                  raise SystemExit(f'Refusing to overwrite existing PHP page: {target}')
              target.write_text(text, encoding='utf-8')
              source.unlink()
              converted.append(source.name)

          if not converted:
              raise SystemExit('No pages matched verified reusable blocks.')

          htaccess = r'''DirectoryIndex index.php index.html

<IfModule mod_rewrite.c>
RewriteEngine On

# Keep legacy/public .html URLs canonical even though converted pages are PHP internally.
RewriteCond %{THE_REQUEST} \s/+(.+?)\.php(?:[?\s]) [NC]
RewriteRule ^(.+)\.php$ $1.html [R=301,L,NE]

# Internally serve a converted PHP page when its historical .html file was intentionally replaced.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} ^(.+)\.html$
RewriteCond %1.php -f
RewriteRule ^(.+)\.html$ $1.php [L]
</IfModule>
'''
          Path('.htaccess').write_text(htaccess, encoding='utf-8')

          docs = Path('docs')
          docs.mkdir(exist_ok=True)

          skipped_header_reason = (
              'Header/navigation was intentionally left page-local in this pass because the export contains '
              'page-specific current-menu/current-page classes. Sharing one static header would visibly mark '
              'the wrong navigation item on some pages.'
          )
          skipped_head_reason = (
              'Head markup was intentionally left page-local because titles and Elementor/post-specific CSS '
              'links differ by page. This preserves existing SEO metadata and CSS order without inventing a '
              'new metadata model during a structural refactor.'
          )
          skipped_form_reason = (
              'Enquiry/contact CTA blocks were not promoted to global includes because the audit did not prove '
              'one exact reusable block across the converted page set.'
          )

          report = f'''# PHP include architecture audit

This refactor is intentionally conservative. It only extracts blocks that were proven byte-identical across multiple root pages.

## Shared includes created

- `includes/footer.php` — exact repeated footer block; detected on **{len(footer_pages)}** HTML pages.
- `includes/scripts.php` — exact repeated common JavaScript bundle; detected on **{len(scripts_pages)}** HTML pages.

## Converted pages

**{len(converted)}** root pages were converted from `.html` files to internal `.php` files. Their public/internal links remain `.html`; `.htaccess` maps an existing legacy `.html` request to the matching PHP file without changing the browser URL.

Footer include used on **{len(footer_converted)}** converted pages. Common scripts include used on **{len(scripts_converted)}** converted pages.

## Intentionally not extracted

- **Header/navigation:** {skipped_header_reason}
- **Head:** {skipped_head_reason}
- **Enquiry/contact CTA:** {skipped_form_reason}
- **Breadcrumbs:** retained page-local because the content is page-specific and no normalization was required for this safe pass.

## Compatibility rules

- Existing `.html` links are preserved.
- Relative asset paths remain unchanged because the browser-visible URL remains the historical root-level `.html` URL.
- Direct requests for converted `.php` URLs are redirected back to `.html` on Apache/LiteSpeed via `.htaccess`.
- Unconverted `.html` pages continue to work as static files.
- This architecture now requires PHP plus Apache/LiteSpeed rewrite support for converted pages; a purely static host cannot execute the includes.

## Validation performed automatically

Every converted page was rendered with PHP CLI and compared byte-for-byte with its original HTML source. PHP syntax checks were run for every converted page and include. The build also verifies that every converted legacy filename has exactly one PHP replacement and that shared include markers are not duplicated.

## Converted legacy filenames

''' + '\n'.join(f'- `{name}`' for name in converted) + '\n'
          (docs / 'php-architecture.md').write_text(report, encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace(
              '# Techco — standalone HTML website',
              '# Techco — PHP include architecture with legacy HTML URLs',
              1,
          )
          readme_text = readme_text.replace(
              'Open `index.html` in your browser. Upload the entire folder to any static website host to publish it. No WordPress installation, PHP, database, npm install, or build step is needed.',
              'Public links continue to use the existing `.html` URLs. Repeated verified site chrome is now served through PHP includes, so converted pages require a PHP-capable Apache/LiteSpeed host with rewrite support. No WordPress installation, database, npm install, or build step is needed.',
              1,
          )
          readme_text += '\n\n## PHP includes\n\nSee `docs/php-architecture.md` for the conservative conversion scope, URL-preservation rules, skipped components, and validation details.\n'
          readme.write_text(readme_text, encoding='utf-8')

          # PHP syntax and render-equivalence tests.
          subprocess.run(['php', '-v'], check=True, stdout=subprocess.DEVNULL)
          lint_targets = [includes / 'footer.php', includes / 'scripts.php'] + [Path(n).with_suffix('.php') for n in converted]
          for target in lint_targets:
              subprocess.run(['php', '-l', str(target)], check=True, stdout=subprocess.DEVNULL)

          for legacy in converted:
              php_page = Path(legacy).with_suffix('.php')
              rendered = subprocess.run(
                  ['php', str(php_page)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout.decode('utf-8')
              if rendered != originals[legacy]:
                  raise SystemExit(f'Rendered output changed for {legacy}; refusing to commit.')

              transformed = php_page.read_text(encoding='utf-8')
              if transformed.count(footer_marker) > 1 or transformed.count(scripts_marker) > 1:
                  raise SystemExit(f'Duplicate shared include marker detected in {php_page}.')

          # Ensure every removed historical filename has exactly one internal PHP replacement.
          for legacy in converted:
              if Path(legacy).exists():
                  raise SystemExit(f'Legacy file unexpectedly still exists after conversion: {legacy}')
              if not Path(legacy).with_suffix('.php').is_file():
                  raise SystemExit(f'Missing PHP replacement for converted page: {legacy}')

          print(f'Converted {len(converted)} pages.')
          print(f'Footer reuse count: {len(footer_pages)}')
          print(f'Script bundle reuse count: {len(scripts_pages)}')
          PY

      - name: Remove temporary workflow and commit generated architecture
        shell: bash
        run: |
          rm -f .github/workflows/php-includes-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: introduce shared PHP footer and scripts includes"
          git push origin HEAD:automation/php-includes-build
